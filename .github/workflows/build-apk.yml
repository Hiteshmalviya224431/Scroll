name: Build Scroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No .zip file found in repository! Please upload scroll_android_project.zip via Add file -> Upload files."
            exit 1
          fi
          echo "Extracting $ZIP_FILE..."
          unzip -q -o "$ZIP_FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: Scroll
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Scroll APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Scroll-debug-apk
          path: Scroll/app/build/outputs/apk/debug/app-debug.apk
