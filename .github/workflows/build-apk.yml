​- name: Set up JDK 17
uses: actions/setup-java@v4
with:
java-version: '17'
distribution: 'temurin'
​- name: Setup Gradle
uses: gradle/actions/setup-gradle@v4
with:
gradle-version: '8.9'
​- name: Build Debug APK
working-directory: Scroll
run: gradle assembleDebug --no-daemon --stacktrace
​- name: Upload Scroll APK Artifact
uses: actions/upload-artifact@v4
with:
name: Scroll-debug-apk
path: Scroll/app/build/outputs/apk/debug/app-debug.apk
